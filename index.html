<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy Choi – Design Capture</title>
    <meta http-equiv="refresh" content="3;url=https://andychoi82.github.io/design-capture">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1A1A2E;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .wrap { padding: 40px; }
        .logo {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #7ECFC0;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #2340C4, #7ECFC0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: #2340C4;
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #4B35A8; }
        .redirect-note {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo">Andy Choi</div>
    <h1>Design Capture</h1>
    <p>A Figma plugin that captures web design decisions<br>directly into your workflow.</p>
    <a class="btn" href="https://andychoi82.github.io/design-capture">Go to Design Capture →</a>
    <p class="redirect-note">Redirecting automatically in 3 seconds...</p>
</div>
</body>
</html>
